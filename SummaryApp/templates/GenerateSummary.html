{% load static %}
<html>
<head>
<title>NLP Summarization</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}?v=3.0"/>
 <script LANGUAGE="Javascript" >
function validate(){
	var x=document.forms["f1"]["t1"].value;
	
	if(x == null || x==""){
		window.alert("Text must be enter");
		document.f1.t1.focus();
		return false;
	}
	
	return true;
}
	</script>
</head>
<body>
<div id="wrapper">
	<div id="header">
		<div id="logo">
			<center><font size="4" color="yellow">Developing an NLP Model for Efficient Summarization of Legal and Financial Documents</font></center>
		</div>
		<div id="slogan">
			
		</div>
	</div>
	<div id="menu">
		<ul><center>
		<li><a href="{% url 'TrainNLP' %}">Train NLP Summary Model</a></li>
	  <li><a href="{% url 'GenerateSummary' %}">Generate Summary</a></li>
	  <li><a href="{% url 'index' %}">Logout</a></li>		
		</center></ul>
		<br class="clearfix" />
	</div>
			
	<div id="splash">
		<img class="pic" src="{% static 'images/pipeline_banner.jpg' %}" width="870" height="230" alt="Developing an NLP Model for Efficient Summarization of Legal and Financial Documents" />
	</div>	
	<center>
		<form name="f1" method="post" action="{% url 'GenerateSummaryAction' %}" OnSubmit="return validate()">
			{% csrf_token %}<br/>
			<h3><b>Summary Generation Screen</b></h3>
   
			<font size="" color="black"><center>{{ data }}</center></font><br/>
						
			<table align="center" style="width: 870px; margin: 0 auto; box-shadow: none; border: none;">
				<tr>
					<td style="text-align: right; vertical-align: top; font-weight: 600; width: 120px; border: none; padding: 10px;">Input&nbsp;Text:</td>
					<td style="text-align: left; border: none; padding: 10px;">
						<textarea name="t1" rows="10" style="width: 100%; box-sizing: border-box;"></textarea>
					</td>
				</tr>       
				<tr>
					<td style="border: none;"></td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="submit" value="Generate Summary"></td>
				</tr>
			</table>
			<br/><br/><br/>
		</form>
	</center>
</div>
</body>
</html>
