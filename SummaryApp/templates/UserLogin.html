{% load static %}
<html>
<head>
<title>NLP Summarization</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}?v=3.0"/>
 <script LANGUAGE="Javascript" >
function validate(){
	var x=document.forms["f1"]["username"].value;
	var y=document.forms["f1"]["password"].value;
	
	if(x == null || x==""){
		window.alert("Username must be enter");
		document.f1.username.focus();
		return false;
	}
	if(y == null || y==""){
		window.alert("Password must be enter");
		document.f1.password.focus();
		return false;
	}
	return true;
}
	</script>
</head>
<body>
<div id="wrapper">
	<div id="header">
		<div id="logo">
			<center><font size="4" color="yellow">Developing an NLP Model for Efficient Summarization of Legal and Financial Documents</font></center>
		</div>
		<div id="slogan">
			
		</div>
	</div>
	<div id="menu">
		<ul><center>
	  <li><a href="{% url 'index' %}">Home</a></li>
      <li><a href="{% url 'UserLogin' %}">User Login</a></li>
	  <li><a href="{% url 'Signup' %}">New User Signup</a></li>
	  <li><a href="{% url 'Aboutus' %}">About Us</a></li>
	 		
		</center></ul>
		<br class="clearfix" />
	</div>
			
	<div id="splash">
		<img class="pic" src="{% static 'images/pipeline_banner.jpg' %}" width="870" height="230" alt="Developing an NLP Model for Efficient Summarization of Legal and Financial Documents" />
	</div>	
	<center>
		<form name="f1" method="post" action="{% url 'UserLoginAction' %}" OnSubmit="return validate()">
			{% csrf_token %}<br/>
			<h3><b>User Login Screen</b></h3>
   
			<font size="" color="black"><center>{{ data }}</center></font><br/>
						
			<table align="center" style="width: 450px; margin: 0 auto; box-shadow: none;">
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Username</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="text" name="username" size="30"/></td>
				</tr>
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Password</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="password" name="password" size="30"/></td>
				</tr>
				<tr>
					<td style="border: none;"></td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="submit" value="Login"></td>
				</tr>
			</table>
			<br/><br/><br/>
		</form>
	</center>
</div>
</body>
</html>
