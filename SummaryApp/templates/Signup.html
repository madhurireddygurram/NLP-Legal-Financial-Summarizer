{% load static %}
<html>
<head>
<title>NLP Summarization</title>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}"/>
<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}?v=3.0"/>
 <script LANGUAGE="Javascript" >
 function checkEmail(t3) {
	if (/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/.test(t3)){
		return (true)
	}
	alert("Invalid E-mail Address! Please re-enter.")
	return (false);
}
function validate(){
	var x=document.forms["f1"]["t1"].value;
	var y=document.forms["f1"]["t2"].value;
	var contact=document.forms["f1"]["t3"].value;
	var email=document.forms["f1"]["t4"].value;
	var address=document.forms["f1"]["t5"].value;
	
	if(x == null || x==""){
		window.alert("Username must be enter");
		document.f1.t1.focus();
		return false;
	}
	if(y == null || y==""){
		window.alert("Password must be enter");
		document.f1.t2.focus();
		return false;
	}
	if(contact==0){
		alert("Please enter contact no");
		document.f1.t3.focus();
		return false;
	}
	if(isNaN(contact)){
		alert("Contact no  must be numeric");
		document.f1.t3.focus();
		return false;
	}
	if(contact.length != 10){
		alert("Contact number must be 10 digits long");
		document.f1.t3.focus();
		return false;
	}
	if(email==0){
		alert("Please Enter Email ID");
		document.f1.t4.focus();
		return false;
	}
	if(!checkEmail(email)){
		document.f1.t4.focus();
		return false;
	}
	if(address == null || address==""){
		window.alert("Address must be enter");
		document.f1.t5.focus();
		return false;
	}
	return true;
}
	</script>
</head>
<body>
<div id="wrapper">
	<div id="header">
		<div id="logo">
			<center><font size="4" color="yellow">Developing an NLP Model for Efficient Summarization of Legal and Financial Documents</font></center>
		</div>
		<div id="slogan">
			
		</div>
	</div>
	<div id="menu">
		<ul><center>
	  <li><a href="{% url 'index' %}">Home</a></li>
      <li><a href="{% url 'UserLogin' %}">User Login</a></li>
	  <li><a href="{% url 'Signup' %}">New User Signup</a></li>
	  <li><a href="{% url 'Aboutus' %}">About Us</a></li>
	 		
		</center></ul>
		<br class="clearfix" />
	</div>
			
	<div id="splash">
		<img class="pic" src="{% static 'images/pipeline_banner.jpg' %}" width="870" height="230" alt="Developing an NLP Model for Efficient Summarization of Legal and Financial Documents" />
	</div>	
	<center>
		<form name="f1" method="post" action="{% url 'SignupAction' %}" OnSubmit="return validate()">
			{% csrf_token %}<br/>
			<h3><b>New User Signup Screen</b></h3>
   
			<font size="" color="black"><center>{{ data }}</center></font><br/>
						
			<table align="center" style="width: 500px; margin: 0 auto; box-shadow: none;">
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Username</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="text" name="t1" size="32"/></td>
				</tr>
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Password</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="password" name="t2" size="32"/></td>
				</tr>
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Contact&nbsp;No</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="text" name="t3" size="20"/></td>
				</tr>
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Email&nbsp;ID</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="text" name="t4" size="32"/></td>
				</tr>
				<tr>
					<td style="text-align: right; font-weight: 600; border: none; padding: 10px;">Address</td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="text" name="t5" size="38"/></td>
				</tr>
				<tr>
					<td style="border: none;"></td>
					<td style="text-align: left; border: none; padding: 10px;"><input type="submit" value="Submit"></td>
				</tr>
			</table>
			<br/><br/><br/>
		</form>
	</center>
</div>
</body>
</html>
